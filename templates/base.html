<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Datastraw CRM{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['DM Sans', 'sans-serif'], mono: ['DM Mono', 'monospace'] },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'DM Sans', sans-serif;
    }

    .ticket-row {
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .ticket-row:hover {
      background: #eff6ff;
      transform: translateX(2px);
    }

    .status-open {
      background: #dbeafe;
      color: #1e40af;
    }

    .status-inprogress {
      background: #fef9c3;
      color: #92400e;
    }

    .status-closed {
      background: #dcfce7;
      color: #166534;
    }

    .fade-in {
      animation: fadeIn .35s ease both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: #bfdbfe;
      border-radius: 3px;
    }
  </style>
</head>

<body class="bg-slate-50 min-h-screen">


  <div class="flex h-screen overflow-hidden">
    <aside class="w-64 bg-brand-900 text-white flex flex-col flex-shrink-0">

      <div class="px-6 py-5 border-b border-brand-800">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 bg-brand-500 rounded-lg flex items-center justify-center font-bold text-sm">DS</div>
          <div>
            <div class="font-semibold text-sm leading-tight">Datastraw</div>
            <div class="text-brand-400 text-xs">Support CRM</div>
          </div>
        </div>
      </div>

      <nav class="flex-1 px-4 py-4 space-y-1">
        <a href="/"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium {% if request.url.path == '/' %}bg-brand-700 text-white{% else %}text-brand-200 hover:bg-brand-800 hover:text-white{% endif %} transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
          All Tickets
        </a>
        <a href="/create"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium {% if request.url.path == '/create' %}bg-brand-700 text-white{% else %}text-brand-200 hover:bg-brand-800 hover:text-white{% endif %} transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          New Ticket
        </a>
      </nav>
    </aside>


    <main class="flex-1 flex flex-col overflow-auto">

      <header class="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between flex-shrink-0">
        <div>
          <h1 class="text-lg font-semibold text-slate-800">{% block page_title %}Dashboard{% endblock %}</h1>
          <p class="text-xs text-slate-400 mt-0.5">{% block page_subtitle %}{% endblock %}</p>
        </div>
        <a href="/create"
          class="bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-2 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          New Ticket
        </a>
      </header>

      <div class="flex-1 p-8 fade-in">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>

</body>

</html>
